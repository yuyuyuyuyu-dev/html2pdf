            const fs = require('fs');
            const { PDFDocument, PDFName, PDFStream } = require('pdf-lib');
            PDFDocument.load(fs.readFileSync('output.pdf')).then((pdf) => {
              const count = pdf.context.enumerateIndirectObjects().filter(([, object]) => object instanceof PDFStream && object.dict.get(PDFName.of('Subtype')) === PDFName.of('Image')).length;
              if (count !== 1) {
                throw new Error('Expected 1 image but got ' + count);
              }
            });

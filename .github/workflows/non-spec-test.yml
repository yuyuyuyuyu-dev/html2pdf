name: Non-spec test
on:
  workflow_call:
permissions:
  contents: read
jobs:
  fail-without-required-option:
    name: should fail when a required option is missing
    runs-on: ubuntu-latest
    steps:
      # Arrange
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run build
      - name: Find Chromium
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "${CHROMIUM_PATH}" ]; then
            echo "No Chromium is installed on this runner."
            exit 1
          fi
          echo "Using Chromium at ${CHROMIUM_PATH}"
          echo "CHROMIUM_PATH=${CHROMIUM_PATH}" >> "${GITHUB_ENV}"
      - name: Write a source HTML file
        run: echo "<p>Hello</p>" > source.html
      # Act
      - name: Convert the HTML file without a destination
        run: |
          set +e
          node dist/index.js --chromium-path "${CHROMIUM_PATH}" --src source.html > stdout.txt 2> stderr.txt
          echo "$?" > exit-code.txt
      # Assert
      - name: Check the result
        run: |
          cat stdout.txt stderr.txt
          test "$(cat exit-code.txt)" -eq 1
          grep -F -- "--dest" stderr.txt
  fail-without-chromium:
    name: should fail when Chromium is not found
    runs-on: ubuntu-latest
    steps:
      # Arrange
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run build
      - name: Write a source HTML file
        run: echo "<p>Hello</p>" > source.html
      # Act
      - name: Convert the HTML file with a missing Chromium
        run: |
          set +e
          node dist/index.js --chromium-path missing-chromium --src source.html --dest output.pdf > stdout.txt 2> stderr.txt
          echo "$?" > exit-code.txt
      # Assert
      - name: Check the result
        run: |
          cat stdout.txt stderr.txt
          test "$(cat exit-code.txt)" -eq 1
          grep -F "Error: Chromium not found at: missing-chromium" stderr.txt
          test ! -e output.pdf
  fail-without-source:
    name: should fail when the source HTML file is not found
    runs-on: ubuntu-latest
    steps:
      # Arrange
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run build
      - name: Find Chromium
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "${CHROMIUM_PATH}" ]; then
            echo "No Chromium is installed on this runner."
            exit 1
          fi
          echo "Using Chromium at ${CHROMIUM_PATH}"
          echo "CHROMIUM_PATH=${CHROMIUM_PATH}" >> "${GITHUB_ENV}"
      # Act
      - name: Convert a missing HTML file
        run: |
          set +e
          node dist/index.js --chromium-path "${CHROMIUM_PATH}" --src missing.html --dest output.pdf > stdout.txt 2> stderr.txt
          echo "$?" > exit-code.txt
      # Assert
      - name: Check the result
        run: |
          cat stdout.txt stderr.txt
          test "$(cat exit-code.txt)" -eq 1
          grep -F "Error: Source HTML file not found: missing.html" stderr.txt
          test ! -e output.pdf
  resolve-paths-from-current-directory:
    name: should resolve the source and destination paths from the current directory
    runs-on: ubuntu-latest
    steps:
      # Arrange
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run build
      - name: Find Chromium
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "${CHROMIUM_PATH}" ]; then
            echo "No Chromium is installed on this runner."
            exit 1
          fi
          echo "Using Chromium at ${CHROMIUM_PATH}"
          echo "CHROMIUM_PATH=${CHROMIUM_PATH}" >> "${GITHUB_ENV}"
      - name: Write a source HTML file
        run: |
          mkdir -p work/in work/out
          echo "<p>Hello</p>" > work/in/source.html
      # Act
      - name: Convert the HTML file from another directory
        run: |
          set +e
          cd work
          node ../dist/index.js --chromium-path "${CHROMIUM_PATH}" --src in/source.html --dest out/output.pdf > ../stdout.txt 2> ../stderr.txt
          echo "$?" > ../exit-code.txt
      # Assert
      - name: Check the result
        run: |
          cat stdout.txt stderr.txt
          test "$(cat exit-code.txt)" -eq 0
          node -e "
            const fs = require('fs');
            const { PDFDocument } = require('pdf-lib');
            PDFDocument.load(fs.readFileSync('work/out/output.pdf')).then((pdf) => {
              const count = pdf.getPageCount();
              if (count !== 1) {
                throw new Error('Expected 1 page but got ' + count);
              }
            });
          "
  keep-destination-when-declined:
    name: should keep the existing destination file when overwriting is declined
    runs-on: ubuntu-latest
    steps:
      # Arrange
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run build
      - name: Find Chromium
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "${CHROMIUM_PATH}" ]; then
            echo "No Chromium is installed on this runner."
            exit 1
          fi
          echo "Using Chromium at ${CHROMIUM_PATH}"
          echo "CHROMIUM_PATH=${CHROMIUM_PATH}" >> "${GITHUB_ENV}"
      - name: Write a source HTML file and an existing destination file
        run: |
          echo "<p>Hello</p>" > source.html
          echo "existing" > output.pdf
      # Act
      - name: Convert the HTML file and decline overwriting
        run: |
          set +e
          printf 'n\n' | node dist/index.js --chromium-path "${CHROMIUM_PATH}" --src source.html --dest output.pdf > stdout.txt 2> stderr.txt
          echo "$?" > exit-code.txt
      # Assert
      - name: Check the result
        run: |
          cat stdout.txt stderr.txt
          test "$(cat exit-code.txt)" -eq 0
          grep -F "Skipped." stdout.txt
          test "$(cat output.pdf)" = "existing"
  overwrite-destination-when-accepted:
    name: should overwrite the existing destination file when overwriting is accepted
    runs-on: ubuntu-latest
    steps:
      # Arrange
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run build
      - name: Find Chromium
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "${CHROMIUM_PATH}" ]; then
            echo "No Chromium is installed on this runner."
            exit 1
          fi
          echo "Using Chromium at ${CHROMIUM_PATH}"
          echo "CHROMIUM_PATH=${CHROMIUM_PATH}" >> "${GITHUB_ENV}"
      - name: Write a source HTML file and an existing destination file
        run: |
          echo "<p>Hello</p>" > source.html
          echo "existing" > output.pdf
      # Act
      - name: Convert the HTML file and accept overwriting
        run: |
          set +e
          printf 'y\n' | node dist/index.js --chromium-path "${CHROMIUM_PATH}" --src source.html --dest output.pdf > stdout.txt 2> stderr.txt
          echo "$?" > exit-code.txt
      # Assert
      - name: Check the result
        run: |
          cat stdout.txt stderr.txt
          test "$(cat exit-code.txt)" -eq 0
          node -e "
            const fs = require('fs');
            const { PDFDocument } = require('pdf-lib');
            PDFDocument.load(fs.readFileSync('output.pdf')).then((pdf) => {
              const count = pdf.getPageCount();
              if (count !== 1) {
                throw new Error('Expected 1 page but got ' + count);
              }
            });
          "
  overwrite-destination-with-force:
    name: should overwrite the existing destination file without asking when --force is given
    runs-on: ubuntu-latest
    steps:
      # Arrange
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run build
      - name: Find Chromium
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "${CHROMIUM_PATH}" ]; then
            echo "No Chromium is installed on this runner."
            exit 1
          fi
          echo "Using Chromium at ${CHROMIUM_PATH}"
          echo "CHROMIUM_PATH=${CHROMIUM_PATH}" >> "${GITHUB_ENV}"
      - name: Write a source HTML file and an existing destination file
        run: |
          echo "<p>Hello</p>" > source.html
          echo "existing" > output.pdf
      # Act
      - name: Convert the HTML file with --force
        run: |
          set +e
          node dist/index.js --chromium-path "${CHROMIUM_PATH}" --src source.html --dest output.pdf --force < /dev/null > stdout.txt 2> stderr.txt
          echo "$?" > exit-code.txt
      # Assert
      - name: Check the result
        run: |
          cat stdout.txt stderr.txt
          test "$(cat exit-code.txt)" -eq 0
          if tr -d '[:space:]' < stdout.txt | grep -F "(y/N)"; then
            echo "Expected no overwrite prompt."
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const { PDFDocument } = require('pdf-lib');
            PDFDocument.load(fs.readFileSync('output.pdf')).then((pdf) => {
              const count = pdf.getPageCount();
              if (count !== 1) {
                throw new Error('Expected 1 page but got ' + count);
              }
            });
          "

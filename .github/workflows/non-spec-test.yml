          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "${CHROMIUM_PATH}" ]; then
            echo "No Chromium is installed on this runner."
            exit 1
          fi
          echo "Using Chromium at ${CHROMIUM_PATH}"
          echo "CHROMIUM_PATH=${CHROMIUM_PATH}" >> "${GITHUB_ENV}"
      - name: Write a source HTML file and a stylesheet
        run: |
          echo "@page { size: 300pt 225pt; margin: 0; }" > style.css
          echo '<link rel="stylesheet" href="style.css"><p>Hello</p>' > source.html
      # Act
      - name: Convert the HTML file to a PDF file
        run: |
          set +e
          node dist/index.js --chromium-path "${CHROMIUM_PATH}" --src source.html --dest output.pdf > stdout.txt 2> stderr.txt
          echo "$?" > exit-code.txt
      # Assert
      - name: Check the result
        run: |
          cat stdout.txt stderr.txt
          test "$(cat exit-code.txt)" -eq 0
          node -e "
            const fs = require('fs');
            const { PDFDocument } = require('pdf-lib');
            PDFDocument.load(fs.readFileSync('output.pdf')).then((pdf) => {
              const { width, height } = pdf.getPage(0).getSize();
              if (Math.abs(width - 300) >= 0.5 || Math.abs(height - 225) >= 0.5) {
                throw new Error('Expected a 300x225 pt page but got ' + width + 'x' + height);
              }
            });
          "

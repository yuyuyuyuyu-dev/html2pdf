      - name: Write a source HTML file and an image file
        run: |
          echo "iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAoElEQVR4nA3OgQADUQxEwSAUIQiHEIRDWISPsAiHEIRDCEIRYvLaIZiICDI+VCSKC0fRcTMhNg4R+SEzqbxQFs6bTjF52DQRlWRdVBWqG5foOkyZrYcIXaSK0o0krEPLjB5WTYSL9E1ZyAfbtB/Gzfr9H/omW1Qf1Mb90N1Mv2zP/zAi51BjNA+epudlZtj5/g97yDW1D9rG+9I7zH7ZXX7jRpPBudYfSAAAAABJRU5ErkJggg==" | base64 -d > image.png
          echo '<img src="image.png" width="100" height="100">' > source.html
      # Act
      - name: Convert the HTML file to a PDF file
        run: |
          set +e
          node dist/index.js --chromium-path "${CHROMIUM_PATH}" --src source.html --dest output.pdf > stdout.txt 2> stderr.txt

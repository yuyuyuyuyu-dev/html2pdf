name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert-to-pdf:
    name: should convert to pdf
    runs-on: ubuntu-latest
    env:
      PAGE_WIDTH_PX: '500'
      PAGE_HEIGHT_PX: '400'
    steps:
      # Arrange
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build

      - name: Write a source HTML file
        run: |
          cat > source.html <<HTML
          <!DOCTYPE html>
          <html>
            <head>
              <style>
                @page {
                  size: ${PAGE_WIDTH_PX}px ${PAGE_HEIGHT_PX}px;
                  margin: 0;
                }
                body {
                  background-color: lightblue;
                  margin: 0;
                  padding: 20px;
                  font-family: sans-serif;
                }
              </style>
            </head>
            <body>
              <h1>Hello PDF</h1>
              <p>This should be a ${PAGE_WIDTH_PX}x${PAGE_HEIGHT_PX} px sized PDF page.</p>
            </body>
          </html>
          HTML

      # Act
      - name: Convert the HTML file to a PDF file
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "${CHROMIUM_PATH}" ]; then
            echo "No Chromium is installed on this runner."
            exit 1
          fi
          echo "Using Chromium at ${CHROMIUM_PATH}"
          node dist/index.js --chromium-path "${CHROMIUM_PATH}" --src source.html --dest output.pdf --force

      - uses: actions/upload-artifact@v4
        with:
          name: output-pdf
          path: output.pdf

      # Assert
      - name: Check the PDF file
        run: |
          node -e "
            const fs = require('fs');
            const { PDFDocument } = require('pdf-lib');
            const pointsPerCssPixel = 72 / 96;
            const expectedWidth = Number(process.env.PAGE_WIDTH_PX) * pointsPerCssPixel;
            const expectedHeight = Number(process.env.PAGE_HEIGHT_PX) * pointsPerCssPixel;
            const bytes = fs.readFileSync('output.pdf');
            if (bytes.subarray(0, 5).toString() !== '%PDF-') {
              throw new Error('output.pdf is not a PDF file');
            }
            PDFDocument.load(bytes).then((pdf) => {
              const pages = pdf.getPages();
              if (pages.length !== 1) {
                throw new Error('Expected 1 page but got ' + pages.length);
              }
              const { width, height } = pages[0].getSize();
              if (Math.abs(width - expectedWidth) > 1 || Math.abs(height - expectedHeight) > 1) {
                throw new Error('Expected a ' + expectedWidth + 'x' + expectedHeight + ' pt page but got ' + width + 'x' + height);
              }
              console.log('Converted to a ' + width + 'x' + height + ' pt PDF page.');
            });
          "

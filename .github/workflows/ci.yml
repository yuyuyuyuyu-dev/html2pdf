name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  convert-to-pdf:
    name: should convert to pdf
    runs-on: ubuntu-latest
    env:
      PAGE_WIDTH_PT: '1440'
      PAGE_HEIGHT_PT: '720'
    steps:
      # Arrange
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - name: Write a source HTML file
        run: |
          cat > source.html <<HTML
          <!DOCTYPE html>
          <html>
            <head>
              <style>
                @page {
                  size: ${PAGE_WIDTH_PT}pt ${PAGE_HEIGHT_PT}pt;
                  margin: 0;
                }
                body {
                  background-color: lightblue;
                  margin: 0;
                  padding: 20px;
                  font-family: sans-serif;
                }
              </style>
            </head>
            <body>
              <h1>Hello PDF</h1>
              <p>This should be a ${PAGE_WIDTH_PT}x${PAGE_HEIGHT_PT} pt sized PDF page.</p>
            </body>
          </html>
          HTML
      # Act
      - name: Convert the HTML file to a PDF file
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "${CHROMIUM_PATH}" ]; then
            echo "No Chromium is installed on this runner."
            exit 1
          fi
          echo "Using Chromium at ${CHROMIUM_PATH}"
          node dist/index.js --chromium-path "${CHROMIUM_PATH}" --src source.html --dest output.pdf --force
      - uses: actions/upload-artifact@v7
        with:
          name: output-pdf
          path: output.pdf
      # Assert
      - name: Check the PDF file
        run: |
          node -e "
            const fs = require('fs');
            const { PDFDocument } = require('pdf-lib');
            const expectedWidth = Number(process.env.PAGE_WIDTH_PT);
            const expectedHeight = Number(process.env.PAGE_HEIGHT_PT);
            const bytes = fs.readFileSync('output.pdf');
            if (bytes.subarray(0, 5).toString() !== '%PDF-') {
              throw new Error('output.pdf is not a PDF file');
            }
            PDFDocument.load(bytes).then((pdf) => {
              const pages = pdf.getPages();
              if (pages.length !== 1) {
                throw new Error('Expected 1 page but got ' + pages.length);
              }
              const { width, height } = pages[0].getSize();
              if (width !== expectedWidth || height !== expectedHeight) {
                throw new Error('Expected a ' + expectedWidth + 'x' + expectedHeight + ' pt page but got ' + width + 'x' + height);
              }
              console.log('Converted to a ' + width + 'x' + height + ' pt PDF page.');
            });
          "
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npx biome ci
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        id: actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - run: ${{ steps.actionlint.outputs.executable }} -color
        shell: bash
  yamlfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker://ghcr.io/google/yamlfmt:latest
        with:
          args: -lint .
  publint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm run publint

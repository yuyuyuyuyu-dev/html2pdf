name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spec-test:
    name: Spec test
    permissions:
      contents: read
    uses: ./.github/workflows/spec-test.yml
  non-spec-test:
    name: Non-spec test
    permissions:
      contents: read
    uses: ./.github/workflows/non-spec-test.yml
  biome:
    name: Biome
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/biome.yml@main
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        id: actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - run: ${{ steps.actionlint.outputs.executable }} -color
        shell: bash
  publint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run build
      - run: npm run publint
